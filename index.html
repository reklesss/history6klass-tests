  const variantGrid = document.getElementById('variantGrid');

  const questionsArea = document.getElementById('questionsArea');
  const checkBtn = document.getElementById('checkBtn');
  const backBtn = document.getElementById('backToSelection');
  const resultSection = document.getElementById('resultSection');
  const resultTableContainer = document.getElementById('resultTableContainer');
  const scoreBadge = document.getElementById('scoreBadge');

  let currentQuestions = [];

    const btn = document.createElement('button');

    btn.dataset.variant = i;
    btn.textContent = 'Вариант ' + i;
    btn.addEventListener('click', () => showTest(i));
    variantGrid.appendChild(btn);
  }

  function showTest(variant) {
    currentVariant = variant;
    currentQuestions = variantData[variant] || [];
    // активная кнопка
    document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.variant-btn[data-variant="${variant}"]`)?.classList.add('active');

    // рендер вопросов
    let html = '';
    currentQuestions.forEach((q, idx) => {
      html += `<div class="question-item" data-qidx="${idx}">`;
      html += `<div class="question-text"><span class="q-num">${idx + 1}.</span> ${q.q}</div>`;
      html += `<div class="options">`;
      q.o.forEach((opt, optIdx) => {
        const val = optIdx + 1;
        const id = `q_${variant}_${idx}_${val}`;
        html += `<div class="option">`;
        html += `<input type="radio" name="q_${variant}_${idx}" value="${val}" id="${id}">`;
        html += `<label for="${id}">${val}) ${opt}</label>`;
        html += `</div>`;
      });
      html += `</div></div>`;
    });
    questionsArea.innerHTML = html;

    // показать тест, скрыть выбор
    variantSelection.style.display = 'none';
    testContainer.classList.add('visible');
    resultSection.classList.add('hidden');
    resultTableContainer.innerHTML = '';
    scoreBadge.textContent = '0.0';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function backToSelection() {
    variantSelection.style.display = 'block';
    testContainer.classList.remove('visible');
    document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
    currentVariant = null;
    currentQuestions = [];
    questionsArea.innerHTML = '';
    resultSection.classList.add('hidden');
    resultTableContainer.innerHTML = '';
    scoreBadge.textContent = '0.0';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function evaluate() {
    if (!currentVariant || !currentQuestions.length) return;

    // собрать ответы
    const userAnswers = [];
    for (let i = 0; i < currentQuestions.length; i++) {
      const radios = document.getElementsByName(`q_${currentVariant}_${i}`);
      let val = null;
      for (let r of radios) { if (r.checked) { val = parseInt(r.value, 10); break; } }
      userAnswers.push(val);
    }

    let correctCount = 0;
    let tableHtml = `<table class="result-table">
      <thead><tr><th>№</th><th>Ваш ответ</th><th>Правильный ответ</th><th>Результат</th></tr></thead><tbody>`;

    currentQuestions.forEach((q, idx) => {
      const user = userAnswers[idx];
      const correct = q.c;
      const isCorrect = (user === correct);
      if (isCorrect) correctCount++;

      const correctText = q.o[correct - 1] || '—';
      const userText = user ? q.o[user - 1] : 'нет ответа';

      const userCell = user
        ? `<span class="user-answer">${user}) ${userText}</span>`
        : `<span class="not-answered">—</span>`;
      const correctCell = `<span class="correct-answer">${correct}) ${correctText}</span>`;
      const resultCell = isCorrect
        ? `<span class="correct-cell">✓ верно</span>`
        : `<span class="wrong-cell">✗ неверно</span>`;

      tableHtml += `<tr>
        <td>${idx + 1}</td>
        <td>${userCell}</td>
        <td>${correctCell}</td>
        <td>${resultCell}</td>
      </tr>`;
    });
    tableHtml += `</tbody></table>`;
    resultTableContainer.innerHTML = tableHtml;

    // оценка
    let grade;
    if (correctCount >= 9) grade = 5.0;
    else if (correctCount >= 7) grade = 4.0;
    else if (correctCount >= 5) grade = 3.0;
    else grade = 2.0;
    scoreBadge.textContent = grade.toFixed(1);

    resultSection.classList.remove('hidden');
    setTimeout(() => resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
  }

  checkBtn.addEventListener('click', evaluate);
  backBtn.addEventListener('click', backToSelection);
